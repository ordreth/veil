# What `cargo about generate about.hbs` reads to write THIRD-PARTY-NOTICES.
# Keep `accepted` in step with the allow list of `deny.toml`.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Crates used only to build veil, not linked into it, need no notice in a binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# veil itself (`publish = false`) is not a third party.
private = { ignore = true }
