      <rect x="167" y="33" width="6" height="122" fill="#F3E6D3"/>
      <rect x="117" y="91" width="106" height="6" fill="#F3E6D3"/>
      <rect x="100" y="162" width="140" height="12" rx="4" fill="#F3E6D3"/>
    </g>
    <g filter="url(#ptd-wcInk)" fill="none" stroke="#3B2A2A" stroke-opacity="0.35" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110 30 Q109 25 118 25.5 H221 Q231 25 231 34 V154"/>
      <path d="M100 168 V174 H240 V162"/>
      <path d="M117 34 H223 V154"/>
    </g>
    <g filter="url(#ptd-wcInk)">
