      <polygon points="173.5,178 232,178 200.7,207.4 142.2,207.4" fill="url(#ptd-beam)"/>
      <polygon points="71.3,212.6 129.8,212.6 98.5,242 40,242" fill="url(#ptd-beam)"/>
      <polygon points="136.8,212.6 195.3,212.6 164,242 105.5,242" fill="url(#ptd-beam)"/>
    </g>
    <g filter="url(#ptd-wcGlass)">
