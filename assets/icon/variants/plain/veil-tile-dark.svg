      <circle cx="190" cy="192" r="2.5" fill="#F3E6D3" opacity="0.6"/>
      <circle cx="108" cy="226" r="2.5" fill="#F3E6D3" opacity="0.55"/>
      <circle cx="176" cy="222" r="2" fill="#F3E6D3" opacity="0.5"/>
      <circle cx="150" cy="232" r="1.8" fill="#F3E6D3" opacity="0.4"/>
      <circle cx="94" cy="206" r="1.6" fill="#E0A458" opacity="0.7"/>
      <circle cx="214" cy="190" r="2.2" fill="#C8664A" opacity="0.55"/>
      <circle cx="84" cy="236" r="1.4" fill="#8E5A6B" opacity="0.5"/>
